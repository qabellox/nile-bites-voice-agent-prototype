# Nile Bites Voice Agent - main configuration
# All experimental parameters live in config files, not in code.
# Anything marked provisional is a methodological choice owned by the researcher.

experiment:
  # Human-readable id for the current run set. Change per experiment batch.
  experiment_id: "DEV-000-baseline-instrument"
  # Free-text note recorded into every log line for this run set.
  note: "Instrument development run. NOT a research trial."
  # When true, no data produced is research data.
  is_research_run: false
  # Participant identifier. EMPTY during development.
  #
  # SCIENTIFIC STATUS: required as soon as is_research_run is true. Every turn is
  # written to a flat JSONL file with no nesting, so a session that cannot be
  # attributed to a participant produces rows that cannot be pooled or excluded
  # later. The CLI refuses to start a formal run without one.
  participant_id: ""          # e.g. "P001"; pseudonymous, never a real name
  # Max simultaneous sessions (reserved for future batched runs).
  max_sessions: 1

  # Weekday the restaurant's business rules run under, used for weekday
  # promotions (PROM-01 Tuesday, PROM-03 Sunday, PROM-04 Friday) and for
  # opening hours.
  #
  # SCIENTIFIC STATUS: this is a CONTROLLED VARIABLE the researcher must set.
  # "auto" uses the real current weekday, which means the same trial can produce
  # a different order total on a different day. That is fine while developing the
  # instrument and unacceptable for research data, because it would make the
  # order total a function of the calendar instead of of the code-switching
  # condition. Pin an explicit weekday before any data collection.
  business_weekday: "auto"   # auto | monday | tuesday | ... | sunday

phone:
  # --- Production prototype settings ---------------------------------------
  # The deployed phone/browser agent reads this section. The research
  # instrument (CLI, live loop, experiment runner) ignores it, so changing
  # anything here does not touch A0 or the experiment.
  #
  # Persona prompt. Deliberately different from the research prompt: the
  # research prompt is written for a frozen evaluation trial, this one is
  # written for a caller. Both keep the rule that facts come only from tools.
  prompt_file: "config/prompts/phone_agent_prompt.md"
  #
  # Which layer answers an order request.
  #   false (default) = the language model drives the turn through the tool loop.
  #   true            = the legacy keyword/template path answers first.
  #
  # The legacy path was written when the model was too weak to be trusted with
  # an order. It is the reason the prototype felt scripted: for the most common
  # utterances the model was never consulted at all. It is kept, complete and
  # tested, because it encodes real safety rules — but it is off by default.
  direct_order_path: false
  #
  # Give the model the current order state at the start of every turn. Without
  # this the model only sees the words exchanged, never the order it built, so
  # it re-queries prices it already quoted and cannot continue a thread.
  context_injection: true

architecture:
  # Which turn engine build_app() constructs. This is the ARCHITECTURE factor of
  # the 2x2 design; it is the only place the arm is selected.
  #
  #   a0 = conventional sequential baseline. The frozen BaselinePipeline:
  #        full-utterance ASR -> one LLM tool loop -> deterministic tools ->
  #        complete TTS -> playback. This is the default and the only
  #        implemented arm today.
  #   a1 = reliability/efficiency architecture (context manager, orchestration,
  #        structured tool gateway, validation layer, latency path). NOT
  #        IMPLEMENTED YET: selecting it raises instead of falling back to a0,
  #        so a run can never be mislabelled with an arm it did not execute.
  #
  # Both arms are built from the same providers, tools, database, prompt, and
  # limits; only this value differs between cells.
  engine: "a0"

runtime:
  # Console/logs must be UTF-8 to print Arabic correctly on Windows.
  force_utf8_stdout: true
  # Where runtime artifacts (temp audio) go, relative to project root.
  audio_scratch_dir: "audio_out"
  timezone_for_clock: "local"

paths:
  restaurant_db: "data/restaurant/nile_bites.json"
  tasks_file: "data/tasks/tasks.yaml"
  log_dir: "logs"
  log_filename_template: "session-{session_id}.jsonl"
  run_manifest: "logs/runs/{experiment_id}_manifest.json"
